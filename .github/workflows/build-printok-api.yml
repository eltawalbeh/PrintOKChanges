name: Build PrintOK Neon API
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - '.github/workflows/build-printok-api.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install, bundle and validate
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check dist/index.mjs
          cd dist
          zip -9 -j ../printokapi.zip index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: printok-neon-function
          path: backend/printokapi.zip
          if-no-files-found: error
      - name: Store deployable bundle in change repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/printokapi.zip
          git diff --cached --quiet || git commit -m "Build PrintOK Neon deployable API bundle [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
