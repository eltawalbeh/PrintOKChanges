name: Validate PrintOK frontend
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/check-printok-frontend.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: |
          npm install --no-audit --no-fund --no-save react@^19 react-dom@^19 vite@^8 typescript@^5.7 @types/react@^19 @types/react-dom@^19 @types/node@^22 @vitejs/plugin-react@^6 tailwindcss@^4 @tailwindcss/vite@^4
      - name: Create temporary build scaffold from PrintOK source conventions
        run: |
          cat > index.html <<'EOF'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>PrintOK</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          EOF
          cat > src/main.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App';
          import './index.css';
          createRoot(document.getElementById('root')!).render(<React.StrictMode><App /></React.StrictMode>);
          EOF
          cat > vite.config.ts <<'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';
          export default defineConfig({ plugins: [react(), tailwindcss()] });
          EOF
          cat > tsconfig.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","lib":["ES2020","DOM","DOM.Iterable"],"module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":true,"noEmit":true,"skipLibCheck":true,"types":["vite/client"]},"include":["src","vite.config.ts"]}
          EOF
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npx vite build
